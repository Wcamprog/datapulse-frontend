<div class="mapa-wrapper">
  <div id="mapa-latam" class="mapa-container"></div>

  <div class="mapa-leyenda">
    <span class="leyenda-titulo">Nivel de Riesgo (IRPC)</span>
    <div class="leyenda-items">
      <div class="leyenda-item">
        <span class="punto bajo"></span>
        <span>Bajo (75 - 100)</span>
      </div>
      <div class="leyenda-item">
        <span class="punto moderado"></span>
        <span>Moderado (50 - &lt;75)</span>
      </div>
      <div class="leyenda-item">
        <span class="punto alto"></span>
        <span>Alto (25 - &lt;50)</span>
      </div>
      <div class="leyenda-item">
        <span class="punto critico"></span>
        <span>Crítico (0 - &lt;25)</span>
      </div>
    </div>
  </div>

  @if (paisSeleccionado) {
    <div class="pais-detalle-card">
      <div class="detalle-header">
        <strong>{{ paisSeleccionado.nombre }}</strong>
        <span class="badge" [style.background-color]="paisSeleccionado.color">
          {{ paisSeleccionado.nivel }}
        </span>
      </div>
      <p class="detalle-irpc">
        Índice IRPC: <span>{{ paisSeleccionado.irpc }}</span> / 100
      </p>
      <button mat-button color="primary" (click)="paisSeleccionado = null">Cerrar</button>
    </div>
  }
</div>
