<div class="login-wrapper">
  <div class="login-card">
    <h2 class="title">DataPulse Latam</h2>
    <p class="subtitle">Acceso al Panel de Analistas</p>

    <form (submit)="$event.preventDefault(); onSubmit()">
      
      <div class="input-group">
        <label for="username">Usuario (Email)</label>
        <input id="username" type="text" [value]="loginForm.get('username')?.value" (input)="loginForm.get('username')?.setValue($any($event.target).value)" placeholder="admin@datapulse.com">
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [value]="loginForm.get('password')?.value" (input)="loginForm.get('password')?.setValue($any($event.target).value)" placeholder="********">
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Autenticando...' : 'Ingresar al sistema' }}
      </button>
      
    </form>
  </div>
</div>
