<div class="login-wrapper">
  <div class="login-card">
    <h2 class="title">DataPulse Latam</h2>
    <p class="subtitle">Acceso al Panel de Analistas</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="input-group">
        <label for="email">Usuario (Email)</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="admin@datapulse.com">
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="********">
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Autenticando...' : 'Ingresar al sistema' }}
      </button>
      
    </form>
  </div>
</div>
