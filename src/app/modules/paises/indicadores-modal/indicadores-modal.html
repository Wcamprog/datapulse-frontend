<app-modal 
  [isOpen]="isOpen" 
  [title]="'Indicadores Económicos: ' + (pais?.nombre || '')"
  icon="analytics"
  maxWidth="700px"
  (onClose)="cerrar()">

  <div modal-body>
    <table mat-table [dataSource]="pais?.indicadores || []" class="custom-table">
      
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Indicador </th>
        <td mat-cell *matCellDef="let item"> <strong>{{ item.tipo }}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef> Valor </th>
        <td mat-cell *matCellDef="let item"> {{ item.valor }} </td>
      </ng-container>

      <ng-container matColumnDef="unidad">
        <th mat-header-cell *matHeaderCellDef> Unidad </th>
        <td mat-cell *matCellDef="let item"> {{ item.unidad }} </td>
      </ng-container>

      <ng-container matColumnDef="anio">
        <th mat-header-cell *matHeaderCellDef> Año </th>
        <td mat-cell *matCellDef="let item"> {{ item.anio }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['tipo', 'valor', 'unidad', 'anio']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['tipo', 'valor', 'unidad', 'anio']"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" colspan="4">No hay indicadores registrados para este país.</td>
      </tr>
    </table>
  </div>

  <div modal-footer>
    <button mat-flat-button color="primary" (click)="cerrar()">Cerrar</button>
  </div>

</app-modal>
